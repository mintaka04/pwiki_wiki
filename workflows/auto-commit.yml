name: AI Auto Commit and Push

on:               # trigger - (schedule, workflow_dispatch)(this file)
  schedule:
    - cron: '0 15 * * *'  # UTC 기준. 한국은 UTC보다 9시간 빠름! cron 표현식 읽기 -> 분(0-59) 시간(0-23) 일(1-31) 월(1-12) 요일(0-6, 0=일요일)
  workflow_dispatch:    # 수동 동작

jobs:
  auto-commit:        # 내가 만든 job의 고유 이름. 
    runs-on: ubuntu-latest  # 이걸 빌릴거에요..
    steps:    # step은 - 로 시작하는 작업들을 실행!

      - name: Checkout repository   # 해당 단계의 이름
        uses: actions/checkout@v4   # 핵심기능... github이 공식으로 제공하는 코드 체크아웃 액션을 가져다 쓸 것이다. -> 비어있는 리눅스에 이거 쓸거임. 그리고 여기서 내 코드도 복사해오고... 폴더도 완전한 git 저장소 상태로 셋팅도 해준대..

      - name: Check for changes
        id: git-check   # 해당 단계에 고유한 id를 부여. (나중에 이 단계의 결과값을 쓰기 위해)
        run: |      # 쉘 스크립트 직접 실행할겁니다...!
          git status
          if [[ -z $(git status -s) ]]; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi
        #  가상 환경 작업 폴더의 git 상태를 확인해 로그로 출력
        # -> 변경된 파일 목록을 짧게 출력 = git status -s, $(git status -s) 문자열이 비어있는지 = -z

